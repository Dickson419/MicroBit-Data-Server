<!DOCTYPE html>
<html lang="en">

<body>
    <div class="header">
        <h1>Microbit Mainframe Controller</h1>
    </div>

                <th>Microbit</th>
                <th>Location</th>
                <th>Data Readings</th>
                <th>Remove</th>
            </tr>

            <tr>
                <td>
                    <picture>
                        <source src="images/microbit_1.webp" type="image/webp">
                        <img src="images/microbit_1.webp" alt="image of a microbit" class="microbitImg">
                    </picture>
                </td>

                <td>
                    TEST LOCATION
                </td>
                
                <td>
                    TEST DATA
                </td>

                <td>
                    <button type="button" class="removeRow">Remove Row</button>
                </td>

            </tr>
        </table>
    </div>
